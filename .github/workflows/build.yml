name: build
run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('{0}: {1}', github.ref_name, github.event.head_commit.message) || github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event.head_commit.message || format('Build {0}', github.ref_name) }}

on:
  # Direct pushes to main don't ship anything — releases live on tags. PRs
  # still get a sanity build before merge, and workflow_dispatch is kept
  # for manual reruns. This avoids running the full 12-minute signing
  # pipeline twice when we tag a release commit (once for the main push,
  # once for the tag).
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > tobevpn-release.jks
          ls -la tobevpn-release.jks

      - name: Write local.properties
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # keystore lives at the repo root in CI (we just decoded it
          # there). build.gradle.kts resolves keystore.path through
          # rootProject.file() so a bare `tobevpn-release.jks` lands inside
          # the cloned repo. The local dev convention `../tobevpn-release.jks`
          # only works on a developer machine where the .jks sits one level
          # up alongside the repo clone.
          cat > local.properties <<EOF
          keystore.path=tobevpn-release.jks
          keystore.password=${SIGNING_KEYSTORE_PASSWORD}
          keystore.keyAlias=${SIGNING_KEY_ALIAS}
          keystore.keyPassword=${SIGNING_KEY_PASSWORD}
          EOF

      - name: Build release APK splits
        # APK splits and AAB can't be built in one gradle invocation
        # (Google issuetracker #402800800 — "shrunk-resources files" collide
        # because the AAB pre-bundle expects a single output but splits
        # produce many). Build them separately.
        env:
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
          # Production API and subscription fallback endpoints are required.
          # Gradle rejects blank/placeholder values so a release cannot ship
          # with an unusable subscription refresh path.
          FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Google Play AAB (no splits)
        # AAB ships every ABI inside one bundle; splits would conflict.
        # The -PdisableAbiSplits property is read by app/build.gradle.kts
        # to flip splits.abi.isEnable to false for this run.
        env:
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
          FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}
        run: ./gradlew bundlePlayRelease -PdisableAbiSplits --no-daemon

      - name: Locate and rename artifacts
        # The splits {} block in app/build.gradle.kts produces one APK per
        # ABI (arm64-v8a, armeabi-v7a, x86_64) plus one universal fallback,
        # all named `app-<abi>-release.apk`. We rename them to a stable
        # convention `ToBeVPN-<version>-<abi>-<sha>.apk` because the
        # in-app updater on the device matches asset names by the
        # `-<abi>-` token to find the split for its primary ABI.
        run: |
          set -e
          VERSION=$(grep -E "^\s*versionName" app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=${GITHUB_SHA:0:7}

          mkdir -p artifacts
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" -release.apk)        # e.g. app-arm64-v8a
            abi=${base#app-}                            # e.g. arm64-v8a
            cp "$apk" "artifacts/ToBeVPN-${VERSION}-${abi}-${SHA}.apk"
          done

          AAB=$(find app/build/outputs/bundle/playRelease -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::AAB missing"
            ls -R app/build/outputs/
            exit 1
          fi
          cp "$AAB" "artifacts/ToBeVPN-${VERSION}-GooglePlay-${SHA}.aab"

          echo "--- artifacts/ ---"
          ls -la artifacts/

          if ! ls artifacts/*.apk >/dev/null 2>&1; then
            echo "::error::no APK splits produced — splits {} block likely misconfigured"
            ls -R app/build/outputs/
            exit 1
          fi

      - name: Upload APK splits
        uses: actions/upload-artifact@v5
        with:
          name: ToBeVPN-apk
          path: artifacts/*.apk
          if-no-files-found: error
          # Keep CI artifacts short-lived. The release is the source of truth
          # for distribution; long-retained artifacts in a public repo can be
          # downloaded by any logged-in GitHub user and revive removed
          # versions outside the release flow.
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: ToBeVPN-aab
          path: artifacts/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Wipe sensitive files
        if: always()
        run: |
          rm -f tobevpn-release.jks local.properties

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ToBeVPN-apk/*.apk
            dist/ToBeVPN-aab/*.aab
          generate_release_notes: true

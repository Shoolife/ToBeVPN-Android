name: check xray-core
run-name: Check Xray-core updates

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Android client
        uses: actions/checkout@v4

      - name: Compare upstream Xray-core with embedded native core
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: XTLS/Xray-core
          VERSION_FILE: app/libs/libv2ray.version
          AAR_FILE: app/libs/libv2ray.aar
        run: |
          set -euo pipefail

          value_from_file() {
            local key="$1"
            sed -n "s/^${key}=//p" "$VERSION_FILE" | head -n 1
          }

          embedded_tag=$(value_from_file xray_core)
          embedded_commit=$(value_from_file xray_core_commit)
          wrapper_tag=$(value_from_file android_lib_xray_lite)
          expected_aar_sha=$(value_from_file aar_sha256)
          actual_aar_sha=$(sha256sum "$AAR_FILE" | awk '{print $1}')

          if [ -z "$embedded_tag" ] || [ -z "$embedded_commit" ] || \
             [ -z "$wrapper_tag" ] || [ -z "$expected_aar_sha" ]; then
            echo "Xray version metadata is incomplete: ${VERSION_FILE}"
            exit 1
          fi

          if [ "$actual_aar_sha" != "$expected_aar_sha" ]; then
            echo "libv2ray.aar checksum does not match ${VERSION_FILE}"
            echo "Expected: ${expected_aar_sha}"
            echo "Actual:   ${actual_aar_sha}"
            exit 1
          fi

          native_library="${RUNNER_TEMP}/libgojni.so"
          unzip -p "$AAR_FILE" jni/arm64-v8a/libgojni.so > "$native_library"
          build_info=$(readelf -p .go.buildinfo "$native_library")
          if ! grep -Fq "${embedded_commit:0:12}" <<<"$build_info"; then
            echo "Embedded Xray commit does not match ${VERSION_FILE}: ${embedded_commit}"
            exit 1
          fi

          # Xray-core currently marks its regular dated releases as pre-releases,
          # so /releases/latest is unsuitable: GitHub excludes them by design.
          upstream_json=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" \
            --jq '[.[] | select(.draft == false)] | max_by(.published_at)')
          upstream_tag=$(jq -r '.tag_name' <<<"$upstream_json")
          upstream_url=$(jq -r '.html_url' <<<"$upstream_json")
          upstream_published=$(jq -r '.published_at' <<<"$upstream_json")
          upstream_commit=$(gh api "repos/${UPSTREAM_REPO}/commits/${upstream_tag}" --jq '.sha')

          echo "Embedded: ${embedded_tag} (${embedded_commit}), AndroidLibXrayLite ${wrapper_tag}"
          echo "Upstream: ${upstream_tag} (${upstream_commit}), published ${upstream_published}"

          if [ "$embedded_commit" = "$upstream_commit" ]; then
            echo "The embedded native core matches the newest Xray-core release."
            exit 0
          fi

          app_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          app_tag=$(jq -r '.tag_name' <<<"$app_json")
          app_url=$(jq -r '.html_url' <<<"$app_json")
          title="Update Xray-core from ${embedded_tag} to ${upstream_tag}"

          cat > issue-body.md <<EOF
          A newer Xray-core release is available.

          Native dependency currently embedded in the Android client:
          - Xray-core: \`${embedded_tag}\` (\`${embedded_commit}\`)
          - AndroidLibXrayLite: \`${wrapper_tag}\`

          Upstream release:
          - Xray-core: \`${upstream_tag}\` (\`${upstream_commit}\`)
          - Published: \`${upstream_published}\`

          Release rule:
          - keep Xray updates inside a normal APK/AAB app release;
          - do not add an in-app Xray-only updater;
          - review Xray and Android wrapper changes before replacing the native AAR.

          Android update steps:
          1. Update \`app/libs/libv2ray.aar\` through the approved AndroidLibXrayLite/Xray build process.
          2. Update \`app/libs/libv2ray.version\` and verify its SHA-256 and embedded commit.
          3. Verify Settings shows the real native core version via \`Libv2ray.checkVersionX()\`.
          4. Test VPN start, stop, reconnect, server switching and background operation.
          5. Ship the update through a normal Android patch release.

          Current app release: ${app_url}
          Upstream Xray-core release: ${upstream_url}
          EOF

          existing=$(gh issue list \
            --state open \
            --label "xray-core" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file issue-body.md
            echo "Updated existing Xray-core issue: #${existing}"
            exit 0
          fi

          gh issue create \
            --title "$title" \
            --label "xray-core" \
            --body-file issue-body.md || \
          gh issue create \
            --title "$title" \
            --body-file issue-body.md
